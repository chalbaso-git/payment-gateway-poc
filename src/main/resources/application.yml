spring:
  application:
    name: payment-gateway-poc
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Exige que las entidades Java coincidan exactamente con el SQL de Flyway
    properties:
      hibernate:
        "[format_sql]": true
  flyway:
    enabled: true
    locations: classpath:db/migration

webhook:
  security:
    hmac-secret: ${WEBHOOK_HMAC_SECRET:local-dev-secret-key-change-in-prod}
    max-age-seconds: 300